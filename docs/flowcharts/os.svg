   <g id="text_1">
    <text style="fill: #172d40; font: 700 21px 'DejaVu Sans'; text-anchor: start" x="32.4" y="40.272656" transform="rotate(-0 32.4 40.272656)">Operating-systems coursework</text>
   </g>
   <g id="text_2">
    <text style="fill: #526575; font: 10.5px 'DejaVu Sans'; text-anchor: start" x="32.4" y="69.857344" transform="rotate(-0 32.4 69.857344)">Three independent concurrency and communication exercises</text>
   </g>
   <g id="text_3">
    <text style="fill: #365b71; font: 700 10px 'DejaVu Sans'; text-anchor: start" x="32.4" y="110.88" transform="rotate(-0 32.4 110.88)">HW1: processes</text>
   </g>
   <g id="text_4">
    <text style="fill: #172d40; font: 11.2px 'DejaVu Sans'; text-anchor: middle" x="158.16" y="152.8505" transform="rotate(-0 158.16 152.8505)">Child runs command</text>
   </g>
   <g id="text_5">
    <text style="fill: #172d40; font: 11.2px 'DejaVu Sans'; text-anchor: middle" x="432" y="152.8505" transform="rotate(-0 432 152.8505)">Output enters pipe</text>
   </g>
   <g id="text_6">
    <text style="fill: #172d40; font: 11.2px 'DejaVu Sans'" transform="translate(661.175625 145.941456)">Parent searches</text>
    <text style="fill: #172d40; font: 11.2px 'DejaVu Sans'" transform="translate(654.999 159.759544)">the output stream</text>
   </g>
   <g id="text_7">
    <text style="fill: #365b71; font: 700 10px 'DejaVu Sans'; text-anchor: start" x="32.4" y="222.48" transform="rotate(-0 32.4 222.48)">HW2: shared state</text>
   </g>
   <g id="text_8">
    <text style="fill: #172d40; font: 11.2px 'DejaVu Sans'; text-anchor: middle" x="158.16" y="264.4505" transform="rotate(-0 158.16 264.4505)">Reader / writer jobs</text>
   </g>
   <g id="text_9">
    <text style="fill: #172d40; font: 11.2px 'DejaVu Sans'" transform="translate(387.17025 257.541456)">Synchronisation</text>
    <text style="fill: #172d40; font: 11.2px 'DejaVu Sans'" transform="translate(389.024375 271.359544)">controls access</text>
   </g>
   <g id="text_10">
    <text style="fill: #172d40; font: 11.2px 'DejaVu Sans'" transform="translate(662.13725 257.541456)">Readers share /</text>
    <text style="fill: #172d40; font: 11.2px 'DejaVu Sans'" transform="translate(655.44525 271.359544)">writer is exclusive</text>
   </g>
   <g id="text_11">
    <text style="fill: #365b71; font: 700 10px 'DejaVu Sans'; text-anchor: start" x="32.4" y="334.08" transform="rotate(-0 32.4 334.08)">HW3: file search</text>
   </g>
   <g id="text_12">
    <text style="fill: #172d40; font: 11.2px 'DejaVu Sans'" transform="translate(99.117625 369.141456)">Producer</text>
    <text style="fill: #172d40; font: 11.2px 'DejaVu Sans'" transform="translate(82.644875 382.959544)">finds file paths</text>
   </g>
   <g id="text_13">
    <text style="fill: #172d40; font: 11.2px 'DejaVu Sans'; text-anchor: middle" x="329.31" y="376.0505" transform="rotate(-0 329.31 376.0505)">Bounded queue</text>
   </g>
   <g id="text_14">
    <text style="fill: #172d40; font: 11.2px 'DejaVu Sans'" transform="translate(503.218 369.141456)">Consumers</text>
    <text style="fill: #172d40; font: 11.2px 'DejaVu Sans'" transform="translate(502.865375 382.959544)">search files</text>
   </g>
   <g id="text_15">
    <text style="fill: #172d40; font: 11.2px 'DejaVu Sans'" transform="translate(697.671 369.141456)">Combine totals</text>
    <text style="fill: #172d40; font: 11.2px 'DejaVu Sans'" transform="translate(693.874375 382.959544)">and join workers</text>
   </g>
   <g id="text_16">
    <text style="fill: #526575; font: 9px 'DejaVu Sans'; text-anchor: start" x="32.4" y="446.723438" transform="rotate(-0 32.4 446.723438)">Conceptual data flow. Synchronisation coordinates concurrent work rather than serialising every step.</text>
   </g>
